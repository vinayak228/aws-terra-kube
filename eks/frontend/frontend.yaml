apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 950288991103.dkr.ecr.us-east-1.amazonaws.com/app-frontend:latest
        ports:
        - containerPort: 80

